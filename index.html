<script>

var runtimeTest =
    PacemakerExperienceRuntimeResolver.resolve(
        "growth"
    );


console.log(

    "Experience Runtime Resolver Test",

    runtimeTest

);   

var understandRuntime =
    PacemakerExperienceRuntimeResolver.resolve(
        "understand"
    );


console.log(

    "Understand Runtime Test",

    understandRuntime

);

var runtimePipeline =
    PacemakerExperienceRuntimeResolver.resolve(
        "growth"
    );


var executionResult =
    PacemakerRuntimePipelineExecutor.execute(

        runtimePipeline.runtime,

        {
            goal:
                "growth test"
        }

    );


console.log(

    "Runtime Pipeline Executor Test",

    executionResult

);

    
    var growthRuntime =
    PacemakerRuntimeAdapter.resolve(
        "growth"
    );


console.log(

    "Runtime Adapter Test",

    growthRuntime

);    

var aggregatedResult =

    PacemakerResultAggregator.aggregate(

        "growth",

        executionResult

    );


console.log(

    "Result Aggregator Test",

    aggregatedResult

);

var platformResult =

    PacemakerPlatformRuntime.execute({

        experience:
            "growth",

        goal:
            "platform runtime test"

    });



console.log(

    "Platform Runtime Final Test",

    platformResult

);

var alphaResult =

    PacemakerAlphaEngine.execute({

        experience:
            "growth",

        goal:
            "alpha test"

    });


console.log(

    "Alpha Engine Final Test",

    alphaResult

);

</script>
