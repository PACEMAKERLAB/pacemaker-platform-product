<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>
PACEMAKER Care Experience
</title>

</head>


<body>


<div id="pacemaker-care"></div>


<!-- Session -->

<script src="../../runtime/experience-session/session-model.js"></script>
<script src="../../runtime/experience-session/session-storage.js"></script>
<script src="../../runtime/experience-session/session-state.js"></script>
<script src="../../runtime/experience-session/session-history.js"></script>
<script src="../../runtime/experience-session/session-query.js"></script>


<!-- Care Runtime -->

<script src="runtime.js"></script>
<script src="index.js"></script>


<script>

var careResult =

    PacemakerCareExperience.start({

        source:
            "result",

        session:
            window.PacemakerExperienceSessionQuery &&
            typeof window.PacemakerExperienceSessionQuery.latest ===
                "function"
                ? window.PacemakerExperienceSessionQuery.latest()
                : null

    });


console.log(

    "Care Result:",

    careResult

);


var continueButton =
    document.getElementById(
        "care-continue"
    );


console.log(
    "Care Next Route:",
    careResult.nextStep.navigation.route
);


if (continueButton) {

    continueButton.addEventListener(

        "click",

        function () {

            console.log(
                "Care Click Route:",
                careResult.nextStep.navigation.route
            );

            window.location.href =

                "../../" +
                careResult.nextStep.navigation.route;

        }

    );

}

</script>


</body>

</html>
