<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PACEMAKER Interpretation Experience
    </title>

</head>

<body>

    <main id="interpretation-experience">

        <h1>
            Interpretation
        </h1>

        <p>
            Interpretation Experience
        </p>

    </main>


    <script src="model.js"></script>
    <script src="decision.js"></script>
    <script src="generator.js"></script>
    <script src="language.js"></script>
    <script src="renderer.js"></script>
    <script src="runtime.js"></script>
    <script src="index.js"></script>


    <script>

        var interpretationResult =

            PacemakerInterpretationExperience.start({

                source:
                    "analyze"

            });


        console.log(

            "Interpretation Result:",

            interpretationResult

        );

        if (
    interpretationResult &&
    interpretationResult.nextStep &&
    interpretationResult.nextStep.navigation &&
    interpretationResult.nextStep.navigation.route
) {

    window.location.href =

        "../../" +
        interpretationResult
            .nextStep
            .navigation
            .route;

}

    </script>

</body>

</html>
