<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>
PACEMAKER Result Experience
</title>

</head>


<body>


<div id="pacemaker-result"></div>

<button
    id="result-continue"
    type="button"
>
    CONTINUE
</button>


<!-- Session -->

<script src="../../runtime/experience-session/session-model.js"></script>
<script src="../../runtime/experience-session/session-storage.js"></script>
<script src="../../runtime/experience-session/session-state.js"></script>
<script src="../../runtime/experience-session/session-history.js"></script>
<script src="../../runtime/experience-session/session-query.js"></script>


<!-- Result Core Runtime -->

<script src="../../runtime/11_result/result-model.js"></script>
<script src="../../runtime/11_result/result-generator.js"></script>
<script src="../../runtime/11_result/result-renderer.js"></script>
<script src="../../runtime/11_result/result-runtime.js"></script>


<!-- Result Experience -->

<script src="runtime.js"></script>
<script src="index.js"></script>


<script>

var session = null;


if (
    window.PacemakerExperienceSessionQuery &&
    typeof window
        .PacemakerExperienceSessionQuery
        .latest === "function"
) {

    session =
        window
            .PacemakerExperienceSessionQuery
            .latest();

}


var input = {

    experience:
        "result",

    source:
        "growth",

    session:
        session

};


var resultExperience =

    PacemakerResultExperienceRuntime.execute(
        input
    );


console.log(

    "Result Experience:",

    resultExperience

);


var continueButton =

    document.getElementById(
        "result-continue"
    );


if (continueButton) {

    continueButton.addEventListener(

        "click",

        function () {

            if (
                !resultExperience ||
                !resultExperience.nextStep ||
                !resultExperience.nextStep.navigation ||
                !resultExperience.nextStep.navigation.route
            ) {

                console.error(
                    "Result nextStep route를 찾을 수 없습니다."
                );

                return;

            }


            window.location.href =

                "../../" +
                resultExperience
                    .nextStep
                    .navigation
                    .route;

        }

    );

}

</script>


</body>

</html>
