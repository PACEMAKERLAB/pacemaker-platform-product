<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>
PACEMAKER Recommendation Experience
</title>

</head>

<body>

<div id="recommendation-experience"></div>

<script src="model.js"></script>
<script src="decision.js"></script>
<script src="generator.js"></script>
<script src="language.js"></script>
<script src="renderer.js"></script>
<script src="runtime.js"></script>
<script src="index.js"></script>

<script>

    var recommendationResult =

        PacemakerRecommendationExperience.start({

            source:
                "interpretation"

        });

    console.log(

        "Recommendation Result:",

        recommendationResult

    );

    if (
    recommendationResult &&
    recommendationResult.nextStep &&
    recommendationResult.nextStep.navigation &&
    recommendationResult.nextStep.navigation.route
) {

    window.location.href =

        "../../" +
        recommendationResult
            .nextStep
            .navigation
            .route;

}

</script>

</body>

</html>
